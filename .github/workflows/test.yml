name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq rsync shellcheck
      - name: Check shell syntax
        run: bash -n ollama-unify.sh tests/test-classifier.sh tests/test-transfer.sh tests/fixtures/bin/*
      - name: Run ShellCheck
        run: shellcheck -x ollama-unify.sh tests/test-classifier.sh tests/test-transfer.sh tests/fixtures/bin/*
      - name: Exercise hardware classifiers
        run: ./tests/test-classifier.sh
      - name: Exercise transfer strategies
        run: ./tests/test-transfer.sh
